<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">

  <defs>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="heroGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="0 0 0 0 0.074  0 0 0 0 0.898  0 0 0 0 0.658  0 0 0 0.55 0" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrowHead" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 L3,5 Z" fill="#13E5A8"/>
    </marker>
    <marker id="arrowHeadMuted" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 L3,5 Z" fill="#93A0B4"/>
    </marker>
    <linearGradient id="heroBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#13E5A8"/>
      <stop offset="100%" stop-color="#0B8F6C"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#0A101C"/>
      <stop offset="100%" stop-color="#070B12"/>
    </radialGradient>
    <pattern id="dotGrid" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#141C2B"/>
    </pattern>
  </defs>


  <rect x="0" y="0" width="1920" height="1080" fill="url(#vignette)"/>
  <rect x="0" y="0" width="1920" height="1080" fill="url(#dotGrid)"/>
